<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Inventaris Aset SRMA 34 Lebak</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#eef2f7;
}

/* WRAPPER */
.wrapper{
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    height:100vh;
    position:fixed;
    backdrop-filter: blur(14px);
    background: rgba(44,62,80,0.85);
    border-right: 1px solid rgba(255,255,255,0.08);
}

.sidebar.collapsed{
    width:70px;
}

.logo{
    text-align:center;
    padding:20px 10px;
    font-weight:bold;
    font-size:18px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    padding:14px 20px;
    text-decoration:none;
    transition:0.2s;
}

.menu a:hover{
    background: rgba(255,255,255,0.08);
}

.menu a:hover i{
    transform: scale(1.2);
}

.menu a.active{
    background:#1abc9c;
}

.menu i{
    transition: transform 0.25s ease;
}

.menu a:active i{
    transform: scale(0.85) rotate(-8deg);
}

/* collapse text */
.sidebar.collapsed .text{
    display:none;
}

/* CONTENT */
.content{
    margin-left:240px;
    padding:25px;
    width:100%;
    transition: margin-left 0.35s cubic-bezier(.4,0,.2,1);
}

.content.expanded{
    margin-left:70px;
}

/* TOGGLE BUTTON */
.toggle-btn{
    position:absolute;
    top:15px;
    right:-15px;
    background:#1abc9c;
    border-radius:50%;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:white;
    font-size:14px;
}

.icon-logo {
    width: 16px;
    height: 16px;
}

</style>
</head>
<body>

<div class="wrapper">

<div id="sidebar" class="sidebar collapsed">
    <div class="logo">
    <i class=""><img src="{{ url_for('static', filename='icon/logo.png') }}" class="icon-logo"> </i>
    </div>

    <div class="toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>

    <div class="menu">
        <a href="/" class="{{ 'active' if request.path == '/' else '' }}">
            <i class="fas fa-chart-line"></i>
            <span class="text">Dashboard</span>
        </a>

        <a href="/barang" class="{{ 'active' if request.path == '/barang' else '' }}">
            <i class="fas fa-box"></i>
            <span class="text">Data Barang</span>
        </a>

        <a href="/ruangan" class="{{ 'active' if request.path.startswith('/ruangan') else '' }}">
            <i class="fas fa-building"></i>
            <span class="text">Data Ruangan</span>
        </a>

        <a href="/barang_ruang" class="{{ 'active' if request.path.startswith('/barang_ruang') else '' }}">
            <i class="fas fa-clipboard-list"></i>
            <span class="text">Penempatan Aset</span>
        </a>

        <a href="/rekap" class="{{ 'active' if request.path.startswith('/rekap') else '' }}">
            <i class="fas fa-clipboard-check"></i>
            <span class="text">Rekap</span>
        </a>

        <div style="
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    text-align: center;
">

{% if session.get('role') == 'admin' %}

    <!-- ✅ TAMPIL SAAT LOGIN -->
    <a href="/logout" title="Logout">
        <img src="{{ url_for('static', filename='icon/admin.png') }}"
             style="width:40px; height:40px; border-radius:50%; cursor:pointer;">
        <span class="text">Admin</span>
    </a>
    
{% else %}

    <!-- ✅ TAMPIL SAAT BELUM LOGIN -->
    <a href="/login" title="Login Admin" class="{{ 'active' if request.path.startswith('/login') else '' }}">
        <!--<img src="{{ url_for('static', filename='icon/login.png') }}"
             style="width:40px; height:40px; border-radius:50%; cursor:pointer;">-->
        <span class="text">Login</span>
    </a>

{% endif %}

</div>

    </div>
</div>

<div id="content" class="content expanded">
    {% block content %}{% endblock %}
</div>

</div>

<script>
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("collapsed");
    document.getElementById("content").classList.toggle("expanded");
}
</script>

</body>
</html>
